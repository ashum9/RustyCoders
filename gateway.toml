[global]
max_connections = 1000

[[listeners]]
name = "service-a"
listen = "127.0.0.1:8080"
backends = ["127.0.0.1:9001", "127.0.0.1:9002", "127.0.0.1:9003"]
strategy = "round_robin"
connect_timeout_ms = 1000

[listeners.health_check]
enabled = true
interval_ms = 2000
timeout_ms = 500
healthy_threshold = 2
unhealthy_threshold = 3
